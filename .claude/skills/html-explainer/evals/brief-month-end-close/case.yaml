schema_version: "1.1"
name: brief-month-end-close
expected_outcome: |
  A brief-tier standalone HTML page that opens with the conclusion (more accountants won't shorten
  close; the intercompany cut-off and controller availability will), models the close as a dependency
  chain where waiting dominates working time, lets the reader change those two levers and see days-to-
  close respond, uses the house visual system, British English, and labels the figures as coming from
  the user's description.
